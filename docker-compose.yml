name: technix

# One command starts everything:  docker compose up --build
# All settings come from the .env file next to this one (copy .env.example to .env).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: technix
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432" # only needed when running the backend outside Docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d technix"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP, the backend sends mail here
      - "8025:8025" # web UI to view caught emails

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"   # AMQP, the backend connects here
      - "15672:15672" # management UI: queues, messages, the DLQ
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Forwards Stripe sandbox webhooks to the backend. On start it prints the signing secret
  # (whsec_...): run "docker compose logs stripe-cli" and put it in STRIPE_WEBHOOK_SECRET.
  stripe-cli:
    image: stripe/stripe-cli:latest
    restart: unless-stopped
    environment:
      # the CLI reads its key from here, so "docker compose exec stripe-cli stripe ..." works too
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY}
    command: >
      listen
      --forward-to http://backend:8080/payments/webhook
      --events payment_intent.succeeded,payment_intent.payment_failed,payment_intent.canceled,charge.refunded,refund.updated,refund.failed
    depends_on:
      - backend

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # inside the compose network, services reach each other by service name, not localhost
      DB_URL: jdbc:postgresql://postgres:5432/technix
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  rabbitmq_data:
