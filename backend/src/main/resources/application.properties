spring.application.name=ILoveShopping
server.port=8080
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#Cloudinary credentials
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

jwt.secret=${JWT_SECRET}
#JWT expiration in milliseconds, keep lower for more security.
jwt.expiration=${JWT_EXPIRATION}
refresh.expiration=${REFRESH_EXPIRATION}
reset.expiration=${RESET_EXPIRATION}

# encrypts the per-user 2FA secrets stored in the database (TotpSecretCipher)
totp.encryption-key=${TOTP_ENCRYPTION_KEY}

app.frontend.url=${FRONTEND_URL}

recaptcha.secret=${RECAPTCHA_SECRET}

google.client-id=${GOOGLE_CLIENT_ID}

# schema is managed by Flyway (db/migration); Hibernate only checks entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

#Set tomcat maximum upload limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Mailpit catches all mail in development. Inside docker compose the host is "mailpit".
spring.mail.port=${MAIL_PORT:1025}
spring.mail.host=${MAIL_HOST:localhost}

# RabbitMQ carries payment status messages from the payment module to the order module.
# Inside docker compose the host is "rabbitmq". No default for the credentials: a missing value should fail loudly.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Stripe sandbox. Card data never reaches this backend; only Stripe ids and status are stored.
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
# Fail fast instead of waiting on Stripe's defaults (30 s connect, 80 s read): a slow
# gateway becomes our own timeout error, which the checkout turns into a clear message.
stripe.connect-timeout-ms=5000
stripe.read-timeout-ms=10000

# Actuator: only /actuator/health is reachable over HTTP. It lists each component's
# status (db, rabbit, mail: UP/DOWN) but never details such as hosts or versions.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never

# Structured (JSON, ECS) console logs are switched on in docker compose with
# LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs. Running locally keeps the readable plain console.
